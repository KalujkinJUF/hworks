<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="nav_chat">Чат</title>
    <script src="fouc.js"></script>
    </head>
<body class="chat-page">
    <div class="container">
        <header>
            <nav id="main-nav">
                <a href="index.html" id="nav-home" data-i18n="nav_home">Главная</a>
                <a href="search.html" id="nav-search" data-i18n="nav_search">Поиск</a>
                <a href="friends.html" id="nav-friends" style="display: none;" data-i18n="nav_friends">Друзья</a>
                <a href="groups.html" id="nav-groups" style="display: none;" data-i18n="nav_groups">Группы</a>
                <a href="register.html" id="nav-register" data-i18n="nav_register">Регистрация</a>
                <a href="login.html" id="nav-login" data-i18n="nav_login">Логин</a>
                <a href="profile.html" id="nav-profile" style="display: none;" data-i18n="nav_profile">Профиль</a>
                <a href="admin.html" id="nav-admin" style="display: none;" data-i18n="nav_admin">Админка</a>
                </nav>
        </header>

        <main class="main-layout chat-layout">
            <!-- Левая колонка: список друзей -->
            <div class="chat-friends-column">
                <div class="chat-section">
                    <div class="chat-header" style="justify-content: center; align-items: center;">
                        <h2 style="margin: 0; padding: 0; border: none; font-size: 16px; color: white; text-transform: uppercase; text-align: center;" data-i18n="nav_chat">ЛС</h2>
                    </div>
                    <div id="chatFriendsList" class="friends-list" style="margin-top: 15px;">
                        <p class="loading-text" data-i18n="loading">Загрузка друзей...</p>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: чат -->
            <div class="chat-main-column">
                <div class="chat-section">
                    <div class="chat-header">
                        <div id="chatInfo" class="chat-info" style="display: none;">
                            <div class="friend-chat-info">
                                <h2 id="chatTitle" data-i18n="chat_no_chat">Выберите друга</h2>
                                <span id="friendStatus" class="friend-chat-status"></span>
                            </div>
                        </div>
                        <div id="noChat" class="loading-text" data-i18n="chat_no_chat">Выберите друга для начала чата</div>
                    </div>

                    <div id="messagesContainer" class="messages-container" style="display: none;">
                        <p class="loading-text" data-i18n="loading">Загрузка сообщений...</p>
                    </div>

                    <div id="chatInputSection" class="chat-input-section" style="display: none;">
                        <div id="chatReplyPreview" style="display:none; align-items:center; gap:8px; margin-bottom:8px; padding:6px 8px; background:rgba(255,255,255,0.06); border-radius:6px;"></div>
                        <div class="input-group" style="display: flex; flex-direction: column; gap: 8px;">
                            <textarea id="messageInput" data-i18n-placeholder="chat_message_placeholder" placeholder="Напишите сообщение..." rows="3" maxlength="2000"></textarea>
                            <div style="display: flex; gap: 10px; align-items: center; justify-content: flex-start; width: 100%; margin-top: 5px; flex-wrap: wrap;">
                                <button id="sendBtn" class="auth-btn" style="width: auto; flex: 0 0 auto; display: inline-block; padding: 8px 20px; font-size: 12px; margin: 0;" data-i18n="send">Отправить</button>
                                <input type="file" id="chatFileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display: none;" />
                                <button id="attachBtn" class="user-btn" style="width: auto; padding: 8px 20px; font-size: 12px; margin: 0; cursor: pointer; border-color: #aaa; color: #aaa;" data-i18n="attach_file">Прикрепить файл</button>
                                <span id="attachedFileName" style="font-size: 11px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;"></span>
                                <button id="clearAttachBtn" class="user-btn" style="display: none; width: auto; padding: 8px 20px; font-size: 12px; border-color: red; color: red; margin: 0; cursor: pointer;" data-i18n="delete">Удалить</button>
                            </div>
                        </div>
                        <div id="sendMessage" class="verify-message" style="margin-top: 8px;"></div>
                    </div>
                </div>
            </div>
        </main>
        <footer style="font-size: 10px; padding: 5px 0;">
            <p><a href="about.html" class="footer-link">&copy; hworks</a></p>
        </footer>
    </div>

    <script src="spa.js"></script>
    <script src="csrf.js"></script>
    <script src="i18n.js"></script>
    <script src="index.js"></script>
    <script src="profile.js"></script>
    <script src="chat.js"></script>
    <script src="groups.js"></script>
    <script src="friends.js"></script>
    <script src="admin.js"></script>
    <script src="search.js"></script>
    <script src="login.js"></script>
    <script src="register.js"></script>
    <script src="navbar.js"></script>
    
</body>
</html>
