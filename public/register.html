<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="styles.css"> 
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
    <div class="container">
        <header>
<nav id="main-nav">
    <a href="index.html" id="nav-home">Главная</a>
    <a href="search.html" id="nav-search" style="display: none;">Поиск</a>
    <a href="friends.html" id="nav-friends" style="display: none;">Друзья</a>
    <a href="register.html" id="nav-register">Регистрация</a>
    <a href="login.html" id="nav-login">Логин</a>
    <a href="profile.html" id="nav-profile" style="display: none;">Профиль</a>
    <a href="admin.html" id="nav-admin" style="display: none;">Админка</a>
    <a href="#" id="nav-logout" style="display: none; color: red; border-color: red;">Выйти</a>
</nav>
        </header>

        <main>
            <section class="auth-form">
                <h2>Регистрация пользователя</h2>
                <form id="register-form">
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Имя пользователя" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Email (обязательно)" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" placeholder="Пароль" required>
                    </div>
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAADrA8pNzRhRwRbI4" data-theme="dark" style="margin-bottom: 15px; display: flex; justify-content: center;"></div>
                    <button type="submit" class="auth-btn">Зарегистрироваться</button>
                    <div id="message" class="error-message"></div>
                </form>
                
                <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </section>
        </main>
    </div>
    <script src="register.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
