<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="admin_panel_title">Админ-панель</title>
    <script src="fouc.js"></script>
    </head>
<body>
    <div class="container admin-container">
        <header>
<nav id="main-nav">
    <a href="index.html" id="nav-home" data-i18n="nav_home">Главная</a>
    <a href="search.html" id="nav-search" style="display: none;" data-i18n="nav_search">Поиск</a>
    <a href="friends.html" id="nav-friends" style="display: none;" data-i18n="nav_friends">Друзья</a>
    <a href="chat.html" id="nav-chat" style="display: none;" data-i18n="nav_chat">Чат</a>
    <a href="register.html" id="nav-register" data-i18n="nav_register">Регистрация</a>
    <a href="login.html" id="nav-login" data-i18n="nav_login">Логин</a>
    <a href="profile.html" id="nav-profile" style="display: none;" data-i18n="nav_profile">Профиль</a>
    <a href="admin.html" id="nav-admin" style="display: none;" data-i18n="nav_admin">Админка</a>
    <a href="#" id="nav-logout" style="display: none; color: red; border-color: red;" data-i18n="nav_logout">Выйти</a>
</nav>
        </header>

        <main class="admin-main">
            <!-- Внешняя анимированная радужная рамка -->
            <div class="rainbow-border">
                <!-- Внутренняя панель -->
                <div class="admin-panel">
                    <h1 class="admin-title" data-i18n="admin_panel_title">Админ-панель</h1>
                    
                    <!-- Поиск пользователей -->
                    <div class="search-group" style="margin-bottom: 15px;">
                        <input type="text" id="adminSearchInput" data-i18n-placeholder="search_input_placeholder" placeholder="Введите имя..." class="search-input" style="max-width: 100%;">
                    </div>

                    <!-- Блок со списком пользователей -->
                    <div id="usersContainer" class="users-container">
                        <div id="usersList"></div>
                    </div>

                    <!-- Управление Сервисом -->
                    <div class="service-management" style="display: none; margin-top: 20px; border-top: 1px dashed white; padding-top: 15px;">
                        <h2 style="font-size: 14px; color: yellow; margin-bottom: 15px; text-transform: uppercase;">Управление сервисом</h2>
                        <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 15px;">
                            <button id="toggleMaintenanceBtn" class="user-btn" style="padding: 10px; font-size: 11px; cursor: pointer;"></button>
                            <span id="maintenanceStatus" style="font-size: 11px; font-weight: bold;">Загрузка...</span>
                        </div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <button id="updateServiceBtn" class="user-btn" style="padding: 10px; font-size: 11px; cursor: pointer; border-color: #ff4444; color: #ff4444;">ОБНОВИТЬ СЕРВИС</button>
                            <span id="updateStatus" style="font-size: 11px; color: #aaa;"></span>
                        </div>
                    </div>

                    <div id="adminMessage" class="admin-message"></div>
                </div>
            </div>
        </main>
        <footer style="font-size: 10px; padding: 5px 0;">
            <p><a href="about.html" class="footer-link">&copy; hworks</a></p>
        </footer>
    </div>

    <script src="spa.js"></script>
    <script src="csrf.js"></script>
    <script src="i18n.js"></script>
    <script src="index.js"></script>
    <script src="profile.js"></script>
    <script src="chat.js"></script>
    <script src="friends.js"></script>
    <script src="admin.js"></script>
    <script src="search.js"></script>
    <script src="login.js"></script>
    <script src="register.js"></script>
    <script src="navbar.js"></script>
    
</body>
</html>
