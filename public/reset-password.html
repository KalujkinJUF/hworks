<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title data-i18n="reset_title">Сброс пароля</title>
    <script src="fouc.js"></script>
    </head>
<body>
    <div class="container">
        <header>
            <nav id="main-nav">
                <a href="index.html" id="nav-home" data-i18n="nav_home">Главная</a>
                <a href="search.html" id="nav-search" style="display: none;" data-i18n="nav_search">Поиск</a>
                <a href="friends.html" id="nav-friends" style="display: none;" data-i18n="nav_friends">Друзья</a>
                <a href="register.html" id="nav-register" data-i18n="nav_register">Регистрация</a>
                <a href="login.html" id="nav-login" data-i18n="nav_login">Логин</a>
                <a href="profile.html" id="nav-profile" style="display: none;" data-i18n="nav_profile">Профиль</a>
                <a href="admin.html" id="nav-admin" style="display: none;" data-i18n="nav_admin">Админка</a>
                </nav>
        </header>

        <main id="reset-root">
            <section class="auth-form">
                <h2 data-i18n="reset_title">Сброс пароля</h2>
                <p style="font-size: 12px; margin-bottom: 15px;" data-i18n="reset_hint">На вашу почту отправлен код подтверждения. Введите его, чтобы подтвердить личность.</p>

                <!-- Шаг 1: подтверждение личности кодом -->
                <div id="reset-step-code">
                    <div class="input-group">
                        <input type="text" id="reset-code" maxlength="6" inputmode="numeric" data-i18n-placeholder="reset_code_placeholder" placeholder="Код из письма">
                    </div>
                    <button type="button" id="reset-verify-btn" class="auth-btn" data-i18n="reset_verify_btn">Подтвердить код</button>
                </div>

                <!-- Шаг 2: ввод нового пароля (разблокируется после проверки кода) -->
                <div id="reset-step-password" style="display: none;">
                    <div class="input-group">
                        <input type="password" id="reset-new-password" data-i18n-placeholder="reset_new_password_placeholder" placeholder="Новый пароль">
                    </div>
                    <button type="button" id="reset-confirm-btn" class="auth-btn" data-i18n="reset_confirm_btn">Сменить пароль</button>
                </div>

                <div id="reset-message" class="error-message" style="margin-top: 12px;"></div>
                <p style="font-size: 11px; margin-top: 15px;"><a href="login.html" class="footer-link" data-i18n="reset_back_login">← Назад ко входу</a></p>
            </section>
        </main>
        <footer style="font-size: 10px; padding: 5px 0;">
            <p><a href="about.html" class="footer-link">&copy; hworks</a></p>
        </footer>
    </div>
    <script src="spa.js"></script>
    <script src="csrf.js"></script>
    <script src="i18n.js"></script>
    <script src="index.js"></script>
    <script src="profile.js"></script>
    <script src="chat.js"></script>
    <script src="groups.js"></script>
    <script src="friends.js"></script>
    <script src="admin.js"></script>
    <script src="search.js"></script>
    <script src="login.js"></script>
    <script src="reset-password.js"></script>
    <script src="register.js"></script>
    <script src="navbar.js"></script>

</body>
</html>
