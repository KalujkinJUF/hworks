<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title data-i18n="register_title">Регистрация</title>
    <script src="fouc.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <nav id="main-nav">
                <a href="index.html" id="nav-home" data-i18n="nav_home">Главная</a>
                <a href="search.html" id="nav-search" style="display: none;" data-i18n="nav_search">Поиск</a>
                <a href="friends.html" id="nav-friends" style="display: none;" data-i18n="nav_friends">Друзья</a>
                <a href="register.html" id="nav-register" data-i18n="nav_register">Регистрация</a>
                <a href="login.html" id="nav-login" data-i18n="nav_login">Логин</a>
                <a href="profile.html" id="nav-profile" style="display: none;" data-i18n="nav_profile">Профиль</a>
                <a href="admin.html" id="nav-admin" style="display: none;" data-i18n="nav_admin">Админка</a>
                </nav>
        </header>

        <main>
            <section class="auth-form">
                <h2 data-i18n="register_title">Регистрация пользователя</h2>
                <form id="register-form">
                    <div class="input-group">
                        <input type="text" id="username" data-i18n-placeholder="register_user_placeholder"
                            placeholder="Имя пользователя" required>
                    </div>
                    <div class="input-group">
                        <input type="email" id="email" data-i18n-placeholder="register_email_placeholder"
                            placeholder="Email (обязательно)" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" data-i18n-placeholder="register_pass_placeholder"
                            placeholder="Пароль" required>
                    </div>
                    <div class="cf-turnstile" data-sitekey="0x4AAAAAADwk5i5nGekxsIck" data-theme="dark"
                        style="margin-bottom: 15px; display: flex; justify-content: center;"></div>
                    <button type="submit" class="auth-btn" data-i18n="register_btn">Зарегистрироваться</button>
                    <div id="message" class="error-message"></div>
                </form>

                <p class="auth-switch"><span data-i18n="register_has_account">Уже есть аккаунт?</span> <a
                        href="login.html" data-i18n="register_login_link">Войти</a></p>
            </section>
        </main>
        <footer style="font-size: 10px; padding: 5px 0;">
            <p><a href="about.html" class="footer-link">&copy; hworks</a></p>
        </footer>
    </div>
    <script src="spa.js"></script>
    <script src="csrf.js"></script>
    <script src="i18n.js"></script>
    <script src="index.js"></script>
    <script src="profile.js"></script>
    <script src="chat.js"></script>
    <script src="friends.js"></script>
    <script src="admin.js"></script>
    <script src="search.js"></script>
    <script src="login.js"></script>
    <script src="register.js"></script>
    <script src="navbar.js"></script>

</body>

</html>
