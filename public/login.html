    <div class="container">
        <header>
            <nav id="main-nav">
                <a href="index.html" id="nav-home" data-i18n="nav_home">Главная</a>

        <main>
            <section class="auth-form">
                <h2 data-i18n="login_title">Вход в систему</h2>
                <form id="login-form">
                    <div class="input-group">
                        <input type="text" id="username" data-i18n-placeholder="login_user_placeholder" placeholder="Логин или Email" required>
                    </div>
                    <div class="input-group">
                        <input type="password" id="password" data-i18n-placeholder="login_pass_placeholder" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="auth-btn" data-i18n="login_btn">Войти</button>
                    
                    <div id="message" class="error-message"></div>
                </form>
            </section>
        </main>
