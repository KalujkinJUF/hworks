<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Друзья</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav id="main-nav">
                <a href="index.html" id="nav-home">Главная</a>
                <a href="search.html" id="nav-search">Поиск</a>
                <a href="friends.html" id="nav-friends" style="display: none;">Друзья</a>
                <a href="chat.html" id="nav-chat" style="display: none;">Чат</a>
                <a href="register.html" id="nav-register">Регистрация</a>
                <a href="login.html" id="nav-login">Логин</a>
                <a href="profile.html" id="nav-profile" style="display: none;">Профиль</a>
                <a href="admin.html" id="nav-admin" style="display: none;">Админка</a>
                <a href="#" id="nav-logout" style="display: none; color: red; border-color: red;">Выйти</a>
            </nav>
        </header>

        <main class="main-layout">
            <div class="feed-column">
                <div class="feed-wrapper">
                    <section class="main-content-wrapper">
                        <h2>Друзья</h2>

                        <!-- Табы для переключения между разделами -->
                        <div class="friends-tabs">
                            <button class="tab-btn active" data-tab="friends">Мои друзья</button>
                            <button class="tab-btn" data-tab="requests">Запросы (<span id="requests-count">0</span>)</button>
                            <button class="tab-btn" data-tab="outgoing">Отправленные</button>
                        </div>

                        <!-- Мои друзья -->
                        <div id="friends-tab" class="tab-content active">
                            <div id="friendsList" class="friends-list">
                                <p class="loading-text">Загрузка...</p>
                            </div>
                            <div id="friendsPagination" class="pagination-container" style="display: flex; justify-content: center; gap: 8px; margin-top: 20px;"></div>
                        </div>

                        <!-- Входящие запросы -->
                        <div id="requests-tab" class="tab-content" style="display: none;">
                            <div id="requestsList" class="friends-list">
                                <p class="loading-text">Загрузка...</p>
                            </div>
                        </div>

                        <!-- Отправленные запросы -->
                        <div id="outgoing-tab" class="tab-content" style="display: none;">
                            <div id="outgoingList" class="friends-list">
                                <p class="loading-text">Загрузка...</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

        </main>
    </div>

    <script src="friends.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
